
services:
  - type: web
    name: medifind-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # External MySQL database
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "11290"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: medifind_db

      # Application secrets
      - key: JWT_SECRET
        generateValue: true

      # Frontend
      - key: FRONTEND_URL
        sync: false

      # Initial administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PHONE
        sync: false